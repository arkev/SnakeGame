<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SnakeGame">
    <meta name="description" content="videojuego basado en el clásico juego de Nokia, Snake Game">
    <title>Snake Game - Consola Retro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/snakeGame.png">
    <link rel="apple-touch-icon" href="images/snakeGame.png">
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
</head>

<body>
    <main class="consola-wrapper">
        <div class="consola" role="region" aria-label="Consola Retro Snake">
            <!-- Barra de opciones: sonido -->
            <div class="consola__opciones">
                <button type="button" id="btn-mute" class="btn-mute" aria-pressed="false"
                    aria-label="Silenciar sonido">🔊</button>
            </div>

            <!-- Marco exterior y pantalla del juego -->
            <div class="consola__pantalla-marco">
                <div class="consola__pantalla-cristal">
                    <canvas id="canvas" width="450" height="450"></canvas>
                    <!-- Registro de récord: 3 iniciales + teclado virtual (móvil/touch) -->
                    <div id="registro-overlay" class="registro" hidden>
                        <div class="registro__tarjeta" role="dialog" aria-modal="true"
                            aria-label="Registrar récord">
                            <p class="registro__titulo">¡RÉCORD!</p>
                            <p class="registro__puntos" id="registro-puntos">10 PTS</p>
                            <div class="registro__iniciales" id="registro-iniciales" aria-label="Iniciales">
                                <span class="registro__letra" data-i="0">A</span>
                                <span class="registro__letra" data-i="1">A</span>
                                <span class="registro__letra" data-i="2">A</span>
                            </div>
                            <p class="registro__ayuda">Toca las letras</p>
                            <div class="registro__teclado" id="registro-teclado" role="group"
                                aria-label="Teclado virtual"></div>
                            <div class="registro__acciones">
                                <button type="button" id="registro-guardar"
                                    class="registro__btn registro__btn--guardar">START: GUARDAR</button>
                                <button type="button" id="registro-cancelar"
                                    class="registro__btn registro__btn--cancelar">BACK: SALIR</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel de controles inferiores -->
            <div class="consola__controles">
                <!-- Cruceta direccional (D-Pad) -->
                <div class="dpad" role="group" aria-label="Cruceta direccional">
                    <button type="button" class="dpad__btn dpad__arriba" data-dir="up" aria-label="Mover arriba">
                        <span class="dpad__flecha">▲</span>
                    </button>
                    <button type="button" class="dpad__btn dpad__izquierda" data-dir="left"
                        aria-label="Mover a la izquierda">
                        <span class="dpad__flecha">◀</span>
                    </button>
                    <div class="dpad__centro" aria-hidden="true"></div>
                    <button type="button" class="dpad__btn dpad__derecha" data-dir="right"
                        aria-label="Mover a la derecha">
                        <span class="dpad__flecha">▶</span>
                    </button>
                    <button type="button" class="dpad__btn dpad__abajo" data-dir="down" aria-label="Mover abajo">
                        <span class="dpad__flecha">▼</span>
                    </button>
                </div>

                <!-- Botones de acción diagonales -->
                <div class="botones-accion" role="group" aria-label="Botones de acción">
                    <!-- Botón Rojo (Volver / Créditos) - Inferior izquierda -->
                    <div class="btn-grupo btn-grupo--rojo">
                        <button type="button" class="btn-circular btn-rojo" id="btn-back"
                            aria-label="Botón Rojo: Volver o Créditos">
                            <span class="btn-barra btn-barra--roja"></span>
                        </button>
                        <span class="btn-etiqueta">BACK</span>
                    </div>

                    <!-- Botón Verde (Iniciar / Pausar) - Superior derecha -->
                    <div class="btn-grupo btn-grupo--verde">
                        <button type="button" class="btn-circular btn-verde" id="btn-start"
                            aria-label="Botón Verde: Iniciar o Pausar">
                            <span class="btn-barra btn-barra--verde"></span>
                        </button>
                        <span class="btn-etiqueta">START</span>
                    </div>
                </div>
            </div>

            <!-- Ranuras decorativas de altavoz -->
            <div class="consola__altavoz" aria-hidden="true">
                <span class="consola__altavoz-ranura"></span>
                <span class="consola__altavoz-ranura"></span>
                <span class="consola__altavoz-ranura"></span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
